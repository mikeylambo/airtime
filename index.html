<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spectral Drift</title>
<!-- MARQUEE type system: Anton (display), Barlow Semi Condensed (UI),
     Space Mono (live data). Self-hosted latin woff2 (public/fonts/, 164 KB
     total) — no runtime dependency, no flash of fallback, works offline. All
     three are SIL Open Font License; see airtime-release-systems.md §L. -->
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: #0a0a12; overflow: hidden; }
  #boot {
    position: fixed; inset: 0; z-index: 60; display: grid; place-content: center; gap: 1.1rem;
    text-align: center; background: radial-gradient(120% 90% at 50% 38%, #16161f 0%, #05050a 72%);
    font-family: "Barlow Semi Condensed", system-ui, sans-serif; color: #eaf2f8;
    transition: opacity .3s ease, visibility .3s;
  }
  #boot.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  #boot h1 { margin: 0; font-family: "Anton", "Arial Narrow", sans-serif;
    font-size: clamp(3.4rem, 13vw, 8rem); letter-spacing: .02em; font-weight: 400; line-height: .9;
    text-transform: uppercase;
    background: linear-gradient(150deg, #f4f8ff 2%, #59d0ff 26%, #7a5cff 58%, #ff2e9a 96%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #boot-msg { font-family: "Space Mono", ui-monospace, monospace;
    color: #ff9f1c; letter-spacing: .26em; font-size: .72rem; }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="splithud" class="hidden"></div>
  <div id="screens"></div>
  <div id="boot"><h1>SPECTRAL DRIFT</h1><div id="boot-msg">LOADING PHYSICS…</div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
