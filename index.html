<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIRTIME</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; }
  #boot {
    position: fixed; inset: 0; z-index: 60; display: grid; place-content: center; gap: 1rem;
    text-align: center; background: radial-gradient(120% 90% at 50% 40%, #16202b 0%, #05080c 70%);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #eaf2f8;
    transition: opacity .3s ease, visibility .3s;
  }
  #boot.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  #boot h1 { margin: 0; font-size: clamp(3rem, 12vw, 7rem); letter-spacing: .22em; font-weight: 800;
    background: linear-gradient(180deg, #fff 10%, #59d0ff 55%, #2b6f92 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #boot-msg { color: #ff9f1c; letter-spacing: .26em; font-size: .78rem; }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="splithud" class="hidden"></div>
  <div id="screens"></div>
  <div id="boot"><h1>AIRTIME</h1><div id="boot-msg">LOADING PHYSICS…</div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
